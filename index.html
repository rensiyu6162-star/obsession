<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>全景节点测试 · 痴迷</title>
<style>
  html,body{margin:0;height:100%;height:100dvh;background:#000;overflow:hidden;color:#ddd;
            font:13px/1.6 system-ui,"Microsoft YaHei",sans-serif}
  #app{position:fixed;inset:0;cursor:grab}
  #app.dragging{cursor:grabbing}
  #hud{position:fixed;left:12px;top:12px;z-index:10;background:rgba(0,0,0,.55);
       padding:8px 10px;border-radius:6px}
  #hud button{font:12px inherit;color:#ddd;background:#222;border:1px solid #444;
              border-radius:4px;padding:3px 8px;margin:0 4px 4px 0;cursor:pointer}
  #hud button:hover{background:#333}
  #coord{color:#8ab4f8;font-family:ui-monospace,Consolas,monospace}
  /* 设置：右上角。z-index 36 是故意压在 #flash(37)/#outvid(38) 下面的——
     过门那段演出正在放的时候不该有个按钮飘在上面。 */
  #settings{position:fixed;right:12px;top:12px;z-index:36;font:12px inherit;color:#bbb;
           background:rgba(0,0,0,.55);border:1px solid #3a3a3a;border-radius:4px;
           padding:5px 10px;cursor:pointer}
  #settings:hover{color:#eee;border-color:#666}
  #panel{position:fixed;inset:0;z-index:41;display:none;align-items:center;
         justify-content:center;background:rgba(0,0,0,.78)}
  #panel .box{background:#131315;border:1px solid #333;border-radius:8px;
              padding:22px 24px;width:min(760px,92%);max-height:88%;overflow:auto}
  #panel h3{margin:0;font-size:15px;font-weight:600;letter-spacing:.24em;color:#ddd}
  #panel .bar{display:flex;align-items:center;justify-content:space-between;
              border-bottom:1px solid #262628;padding-bottom:14px}
  #panel .lbl{margin:20px 0 10px;font-size:12px;color:#888;letter-spacing:.1em}
  #panel .bar button{font:12px inherit;color:#ddd;background:#1e1e20;border:1px solid #444;
                     border-radius:4px;padding:6px 13px;margin-left:8px;cursor:pointer}
  #panel .bar button:hover{background:#2a2a2c}
  #panel .bar button.warn{color:#e88;border-color:#5a2b2b}
  #panel .bar button.warn:hover{background:#2e1b1b}
  #panel .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .slot{position:relative;background:#0d0d0f;border:1px solid #2c2c2e;border-radius:6px;
        overflow:hidden;cursor:pointer;text-align:left}
  .slot:hover{border-color:#5a5a5e}
  .slot .shot{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
  .slot .empty{display:flex;width:100%;aspect-ratio:16/9;align-items:center;
               justify-content:center;color:#4a4a4e;font-size:26px}
  .slot .meta{padding:7px 9px;font-size:11px;line-height:1.7;color:#aaa}
  .slot .meta b{display:block;font-weight:500;color:#ddd;font-size:12px}
  .slot .meta span{color:#777}
  .slot .del{position:absolute;right:5px;top:5px;font:11px inherit;color:#bbb;
             background:rgba(0,0,0,.7);border:1px solid #444;border-radius:3px;
             padding:2px 6px;cursor:pointer}
  .slot .del:hover{color:#f99;border-color:#7a3535}
  #panel .tip{margin-top:14px;font-size:11px;color:#666;line-height:1.9}
  #confirm{position:fixed;inset:0;z-index:42;display:none;align-items:center;
           justify-content:center;background:rgba(0,0,0,.72)}
  /* 贴片：全景图画不出来的特写就盖一张图上去（门口他的正脸、指间那几根头发）。
     等距圆柱投影里站在门口的人只有九十来像素高、脸不到十五像素，捏在指间的头发更是
     一根都画不出来，所以这类镜头只能单独出图。
     每张的取景不一样，object-position 由 showPlate() 现给，见那里的说明。
     transform 那个慢推是为了让静止的照片有一点"你正盯着看"的呼吸感。 */
  /* 贴片。以前是 object-fit:cover 铺满全屏，结果每张图都被裁掉一大截——
     打量那张的眼睛直接被切到画面外，而那双眼睛就是这张图的全部意思。
     现在改成 contain：整张图完整显示，窗口比例对不上就留黑边（所以要自带黑底，
     不然全景会从黑边里透出来）。缓慢推近保留，但幅度从 1.02→1.09 收到 1.0→1.04，
     边缘最多各损失 2%，不会再吃掉构图。
     淡入淡出去掉了：切贴片直接跳转，opacity 不再过渡（全景换房间的 fadePano 不受影响）。 */
  #plate{position:fixed;inset:0;z-index:31;width:100%;height:100%;object-fit:contain;
         background:#000;
         opacity:0;pointer-events:none;transform:scale(1);
         transition:transform 7s linear}
  #plate.on{opacity:1;transform:scale(1.04)}
  #confirm .box{background:#131315;border:1px solid #333;border-radius:8px;
                padding:24px 28px;max-width:340px;text-align:center}
  #confirm p{margin:0 0 6px;font-size:15px;color:#ddd}
  #confirm .sub{font-size:12px;color:#888;line-height:1.8}
  #confirm .row{margin-top:20px;display:flex;gap:10px;justify-content:center}
  #confirm button{font:13px inherit;border-radius:4px;padding:7px 16px;cursor:pointer;
                  color:#ddd;background:#1e1e20;border:1px solid #444}
  #confirm button:hover{background:#2a2a2c}
  #confirm button.warn{color:#e88;border-color:#5a2b2b}
  #confirm button.warn:hover{background:#2e1b1b}
  /* 第四幕那段黑场：动作全部藏在里面，只留声音和字幕。
     所以 z-index 要压在 #story(33) 下面、盖住 #plate(31) 和画布——黑下去之后字幕还得看得见。
     #flash 那层是白色过曝、37，是开门用的，两回事。 */
  #dark{position:fixed;inset:0;z-index:32;pointer-events:none;background:#000;
        opacity:0;transition:opacity 1.6s ease}
  #dark.on{opacity:1}
  #story{position:fixed;left:50%;bottom:8%;transform:translateX(-50%);z-index:33;
         max-width:min(620px,80%);background:rgba(8,8,10,.82);border-left:2px solid #c0392b;
         padding:12px 16px;border-radius:4px;opacity:0;transition:opacity .45s;
         pointer-events:none;font-size:15px;letter-spacing:.02em}
  #story.on{opacity:1}
  /* 说话人。谁说的话就在那句上面单独标一行——剧本的写法。
     narration（没有说话人的叙述句）不带这一行，一眼能分出"谁在说"和"在讲什么"。 */
  #story .who{display:block;font-size:12px;color:#c0392b;letter-spacing:.16em;
              margin-bottom:5px}
  /* 剧情里的二选一。故意压在字幕上面一点，让人先看完那句再选。
     和字幕同一套样式（左边一道红），看着是同一个"叙述层"的东西。 */
  #pick{position:fixed;left:50%;bottom:19%;transform:translateX(-50%);z-index:35;
        display:none;flex-direction:column;gap:9px;min-width:min(430px,76%)}
  #pick.on{display:flex}
  #pick button{font:15px inherit;color:#e6e6e6;background:rgba(8,8,10,.9);
               border:1px solid #3d3d45;border-left:2px solid #7b2b22;
               padding:12px 16px;border-radius:4px;cursor:pointer;text-align:left;
               letter-spacing:.02em;transition:background .16s,border-color .16s,color .16s}
  #pick button:hover{background:#1e1313;border-left-color:#c0392b;color:#fff}
  #crosshair{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;
             z-index:9;pointer-events:none;border:1px solid rgba(255,255,255,.3);border-radius:50%;
             transition:border-color .12s,background .12s}
  #crosshair.hot{border-color:#ffd479;background:rgba(255,212,121,.28)}
  .label{position:fixed;z-index:8;pointer-events:none;transform:translate(-50%,-140%);
         font-size:12px;color:#fff;text-shadow:0 0 6px #000;white-space:nowrap}
  .label.go{color:#ffd479;font-weight:600}
  #enter{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
         background:rgba(0,0,0,.72);cursor:pointer;text-align:center;font-size:19px;letter-spacing:.05em}
  #enter span{display:block;margin-top:10px;font-size:13px;color:#999;letter-spacing:0}
  /* 第一次进入要挡住全部；但按 Esc 退出后再盖回来的这一层要沉到面板下面，
     不然它会吃掉左上角那些按钮的点击（z-index 30 盖住 z-index 10 的 #hud） */
  #enter.back{z-index:9;background:rgba(0,0,0,.5);font-size:15px}
  /* 第一间屋子的全景图还在下载/解码：这层先不接受点击，免得点进去看见一片黑 */
  #enter.wait{cursor:progress;color:#8b8b90}
  /* 致命错误层：WebGL 起不来、显卡上下文丢了这类"黑屏但游戏还活着"的情况，
     与其让玩家对着一屏黑猜，不如把原因说人话讲出来。z-index 60 压过所有面板。 */
  #fatal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
         background:rgba(0,0,0,.88);text-align:center;padding:0 24px;
         font-size:16px;line-height:1.9;color:#ddd;letter-spacing:.02em}
  #fatal.on{display:flex}
  #fatal span{display:block;margin:12px 0 0;font-size:13px;color:#999;line-height:1.8}
  #fatal button{margin-top:20px;font:13px inherit;color:#ddd;background:#1e1e20;
                border:1px solid #444;border-radius:4px;padding:8px 18px;cursor:pointer}
  #fatal button:hover{background:#2a2a2c}
  /* 首屏进度条。按真实下载字节走（见 gateLoad），不是假动画 */
  /* z-index 压过 #rotate(60)：预载在页面一打开就开始跑，竖屏等转屏的那几秒
     正好是下载窗口——条子必须在这层上面看得见，不然转完横屏它早就走完了 */
  #load{position:fixed;left:50%;bottom:24%;transform:translateX(-50%);z-index:62;
        width:min(340px,62%);display:none;text-align:center;pointer-events:none}
  #load.on{display:block}
  #load .bar{height:3px;background:rgba(255,255,255,.14);border-radius:2px;overflow:hidden}
  #load .bar i{display:block;height:100%;width:0;background:#c0392b;
               transition:width .3s linear}
  #load em{display:block;margin-top:9px;font-size:11px;font-style:normal;color:#83838a;
           letter-spacing:.08em;font-family:ui-monospace,Consolas,monospace}
  /* 开门那一下的过曝：白天的光从门缝里灌进来，顺便盖住"房间壳换成视频"这个切换 */
  #flash{position:fixed;inset:0;z-index:37;pointer-events:none;background:#f2efe9;
         opacity:0;transition:opacity 1.4s ease-in}
  #flash.on{opacity:1}
  /* 门后面那段视频：整屏播放，4:3 的片子在宽屏上留黑边，不裁 */
  #outvid{position:fixed;inset:0;z-index:38;display:none;width:100%;height:100%;
          object-fit:contain;background:#000;opacity:0;transition:opacity .8s}
  #ending{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;
          align-items:center;justify-content:center;background:#000;opacity:0;
          transition:opacity 2s ease;padding:0 12%;text-align:center}
  #ending h2{font-size:22px;font-weight:600;letter-spacing:.3em;color:#c0392b;margin:0 0 22px}
  #ending p{font-size:16px;line-height:2.1;color:#ccc;max-width:640px;margin:0}
  #ending button{margin-top:34px;font:13px inherit;color:#ddd;background:#181818;
                 border:1px solid #444;border-radius:4px;padding:7px 20px;cursor:pointer}
  /* 照片墙的放大视图。以前这一层是 pointer-events:none、靠鼠标锁定 + 落回 #app 翻页的，
     结果只能一路往下点：没有鼠标指针、没法回看上一张。现在反过来——
     进照片墙就退出鼠标锁定（showPhoto 里做），指针露出来，这一层自己接点击：
     左右两个箭头翻页、右上角叉退出、图片以外的空白处点一下也是下一张。 */
  #photos{position:fixed;inset:0;z-index:35;display:none;align-items:center;
          justify-content:center;background:rgba(0,0,0,.94);opacity:0;
          transition:opacity .3s;pointer-events:none;cursor:pointer}
  #photos.on{opacity:1;pointer-events:auto}
  #photos .nav,#photos .close{position:absolute;pointer-events:auto;cursor:pointer;
          background:rgba(12,12,14,.72);border:1px solid #3d3d45;color:#ddd;
          border-radius:4px;font:inherit;line-height:1;
          transition:background .16s,border-color .16s,color .16s,opacity .16s}
  #photos .nav{top:50%;width:46px;height:78px;margin-top:-39px;font-size:30px}
  #photos .nav.prev{left:2.2%}
  #photos .nav.next{right:2.2%}
  #photos .close{right:16px;top:44px;width:34px;height:34px;font-size:14px}
  #photos .nav:hover,#photos .close:hover{background:#1e1313;border-color:#c0392b;color:#fff}
  #photos .nav:disabled{opacity:.22;cursor:default;background:rgba(12,12,14,.4)}
  #photos img{max-width:86%;max-height:78%;box-shadow:0 0 70px #000;
              filter:contrast(1.04) saturate(.92)}
  /* 换图那几秒：旧的那张压暗留在原位，中间一行"载入中"。
     以前是直接改 src，图没到之前就是一个空框——满屏黑，看着像坏了。 */
  #photos img.wait{opacity:.1}
  #photos .load{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
                font-size:13px;color:#8f8f96;letter-spacing:.1em;display:none;
                text-shadow:0 0 10px #000}
  #photos.busy .load{display:block}
  #photos .cap{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);
               max-width:min(700px,88%);text-align:center;font-size:15px;line-height:1.95;
               color:#ddd;text-shadow:0 0 8px #000;letter-spacing:.02em}
  #photos .idx{position:absolute;right:18px;top:15px;font-size:12px;color:#666;
               font-family:ui-monospace,Consolas,monospace}

  /* 手里的手机。手和机身是生成的写实素材（绿幕已抠、已按房间灯光调色），
     分两层贴：phone-hand.png 在下、DOM 屏幕在中、phone-hand-front.png（只有皮肤）在上。
     这样压在屏幕上的拇指才在屏幕前面——单层的话 DOM 屏幕会盖住拇指，遮挡就反了。
     屏幕矩形是量出来的：整图 left 8.81% / top 0.16% / w 43.45% / h 59.25%。
     transform-origin 定在屏幕的水平中心 + 图的底边：缩放时底边不动（所以小臂永远
     切在画框外，不会在右下角断成一截），而且放大不会让手机横向漂走。
     只动 transform（GPU 能插值），不动 right/bottom/width：那些一改就是跳变 */
  #phone{position:fixed;right:-4%;bottom:-8%;width:min(430px,45%);aspect-ratio:840/1259;
         z-index:30;cursor:pointer;pointer-events:auto;transform-origin:30.5% 100%;
         transform:translate(14%,56%) rotate(-15deg) scale(1);
         transition:transform .55s cubic-bezier(.2,1.14,.32,1),filter .5s;
         filter:drop-shadow(-12px -6px 30px rgba(0,0,0,.8)) brightness(.72)}
  /* 举到眼前那一下要横移半个屏幕。translate 里的百分比是按元素自身算的，
     所以"半个屏幕"这一段只能给绝对长度：--half 由 JS 按当前画面宽度写（见 resize），
     软件横屏时画面宽度不等于 vw，写死 54vw 就会横移不到位。 */
  #phone.up{transform:translate(calc(69.5% - var(--half,54vw)),0) rotate(-3deg) scale(1.18);
            filter:drop-shadow(-16px -10px 38px rgba(0,0,0,.85)) brightness(1.02)}
  #phone:not(.up):hover{transform:translate(13%,50%) rotate(-14deg) scale(1.01)}
  /* 呼吸：手不会绝对静止。放在内层，跟外层的抬手 transform 互不覆盖 */
  #phone .rig{position:absolute;inset:0;animation:sway 6.4s ease-in-out infinite}
  #phone.up .rig{animation-duration:8.5s}
  @keyframes sway{0%,100%{transform:translate(0,0) rotate(0)}
                  33%{transform:translate(-1%,-0.7%) rotate(.6deg)}
                  66%{transform:translate(.8%,.5%) rotate(-.45deg)}}
  #phone .hand,#phone .handfront{position:absolute;inset:0;width:100%;height:100%;
              object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;
              transition:opacity .5s}
  #phone .handfront{pointer-events:none}
  /* 屏幕的位置、倾角、圆角都是从素材里量出来的（tools/_measure_screen.py）：
     黑板占 left 7.62% / top 0.16% / w 44.76% / h 59.30%，但那块黑**包含边框**，
     所以显示区要再往里收（横向 5.5%、纵向 3%）；机身本身顺时针倾 1.47 度，
     屏幕必须跟着倾，不然贴上去就是歪的——之前那版屏幕比玻璃大、又没倾，才显得假 */
  #phone .scr{position:absolute;left:10.1%;top:1.9%;width:39.8%;height:55.7%;
              border-radius:9%/6%;overflow:hidden;background:#07080a;
              transform:rotate(1.47deg);transition:filter .5s}
  /* 视频比屏幕矮胖（540x720 对 188x371），用 cover 裁掉两边，跟手机全屏播放一样。
     再压暗、加暖：一块干净明亮的屏幕贴在昏黄房间里，一眼就看出是合成的 */
  #phone .vid{width:100%;height:100%;object-fit:cover;display:block;
              filter:sepia(.16) saturate(.88) brightness(.8) contrast(1.06)}
  /* 手机视频的画面画在 canvas（.vid）上；真正解码的 video 缩成 1px 藏起来。
     国产浏览器（百度/UC 等）会无视 playsinline 属性，一放就给 video 强制全屏、
     套上浏览器原生播放器——canvas 的画面不受影响，video 全屏也无从谈起。
     音频照常走 Web Audio（createMediaElementSource），声音不受影响。 */
  #phone .vid-src{position:absolute;width:1px;height:1px;left:-20px;top:-20px;
                  opacity:0;pointer-events:none;object-fit:fill}
  #phone .vid-src::-webkit-media-controls{display:none!important}
  #phone .vid-audio{position:absolute;width:1px;height:1px;left:-20px;top:-20px;
                    opacity:0;pointer-events:none}
  /* 玻璃：一道斜的高光 + 顶部一点内阴影。没有这层，屏幕就是一个贴上去的矩形 */
  #phone .glass{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
                background:linear-gradient(118deg,rgba(255,255,255,.13) 0 18%,
                          rgba(255,255,255,.03) 26% 44%,rgba(255,255,255,0) 52%),
                          radial-gradient(70% 22% at 22% 2%,rgba(255,246,225,.16),transparent 70%)}
  #phone .scr::after{content:'';position:absolute;inset:0;pointer-events:none;
                     box-shadow:inset 0 2px 6px rgba(0,0,0,.55),
                                inset 0 -10px 22px rgba(0,0,0,.35)}
  /* 屏幕的光要洒到手上。放在前景手之后、用 plus-lighter 叠加，
     位置压在拇指和食指那一带——屏幕亮着而手完全不受光，是最出戏的地方 */
  #phone .spill{position:absolute;left:2%;top:38%;width:62%;height:46%;pointer-events:none;
                opacity:0;transition:opacity .5s .12s;mix-blend-mode:plus-lighter;
                background:radial-gradient(52% 46% at 40% 40%,rgba(255,236,205,.34),
                          rgba(255,225,180,.12) 55%,transparent 78%)}
  #phone.up .spill{opacity:1}
  #phone.dim .scr{filter:brightness(.2) saturate(.45)}
  /* 举起来之后再往前凑：整块屏幕推到画面正中并放大（缩放中心就是屏幕中心，
     位移由 JS 按 transform-origin 算，见 zoomTransform），手和机身淡出，
     顺手把机身那 1.47 度倾角转回来，只剩那段录像正正地摆在眼前 */
  #phone.zoom{transition:transform .85s cubic-bezier(.22,.9,.24,1),filter .6s;
              filter:drop-shadow(0 0 44px rgba(0,0,0,.9)) brightness(1)}
  #phone.zoom .hand,#phone.zoom .handfront{opacity:0}
  #phone.zoom .spill{opacity:0}
  #phone.zoom .glass{opacity:.3}
  #phone.zoom .scr::after{box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
  #phone.zoom .vid{filter:sepia(.06) saturate(.96) brightness(.98) contrast(1.03)}
  /* 放大时把房间压暗，不然背景的墙和热点标签会一直跟这段录像抢注意力 */
  #phone-bd{position:fixed;inset:0;z-index:29;background:rgba(4,4,6,.74);
            opacity:0;pointer-events:none;transition:opacity .7s}

    else hook((e.message || 'error') + (e.lineno ? ' @' + e.lineno : ''));
  }, true);

async function loadRain() {
  try {
    const r = await fetch('audio/rain.mp3');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const buf = await AC.decodeAudioData(await r.arrayBuffer());
    const pad = 0.03, dur = buf.duration;
    for (const [rate, off] of [[1, 0], [0.83, dur / 2]]) {
      const s = AC.createBufferSource();
      s.buffer = buf; s.loop = true;
      s.loopStart = pad; s.loopEnd = Math.max(pad + 0.1, dur - pad);
      s.playbackRate.value = rate;
      const g = AC.createGain(); g.gain.value = 0.7;   // 两路叠加，各留 0.7 免得翻倍
      s.connect(g); g.connect(rainGain);
      s.start(0, pad + off);
    }
  } catch (e) {
    console.warn('雨声没加载上，房间会是安静的：', e);
  }
}
function ramp(param, v, sec = 0.8) {

  // 白天雨已经停了，只剩房间自己的低频嗡鸣
  ramp(rainGain.gain, (n.rain ?? 0.4) * (n.off ? 1.3 : 1) * duck * (S.day ? 0 : 1));
  // 默认值必须是 0：没写 drone 的房间不该自己嗡起来（以前默认 0.05，
  // 于是从开场第一秒就有一层 51Hz 的隆隆声，听着像设备噪音而不是气氛）
  ramp(droneGain.gain, (n.drone ?? 0) * (n.off ? 1.9 : 1) * duck * (S.day ? 0.5 : 1));
  ramp(windGain.gain, (n.wind ?? 0) * duck);            // 只有户外那一节点有风
  // 走出客厅后电视还在响，只是隔了一道墙
  // 那台电视只在她自己那套房子里响。出了防盗门（门外/他家）就该听不见了，
  // 隔着一条街还能听见客厅那盘磁带是说不通的。
  const inFlat = node === 'living' || node === 'bedroom' || node === 'corridor';
  if (tvGain && tvSrc) ramp(tvGain.gain, node === 'living' ? 0.55 : inFlat ? 0.16 : 0, 1.0);
  // 兜底：床震和那段喘息只属于床底下和隔壁那面墙（第二章从洞里听见的）。
  // 别的房间里还在震，一定是哪一次没收干净（见 loopSfx 的 LOOP_SEQ 那段注释），
  // 这里无条件收掉——这个函数在换房间、开关灯、举放手机的时候都会跑到。
  if (node !== 'underbed' && node !== 'ndbed') {

function noiseBurst(dur, freq, q, peak, type = 'bandpass') {
  const n = Math.max(1, Math.floor(AC.sampleRate * dur));
  const b = AC.createBuffer(1, n, AC.sampleRate);
  const c = b.getChannelData(0);
  for (let i = 0; i < n; i++) c[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;
  const s = AC.createBufferSource(); s.buffer = b;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); g.gain.value = peak;
  s.connect(f); f.connect(g); g.connect(master); s.start();
  return {f, g, dur};
}
function blip(kind) {

    noiseBurst(0.05, 2600, 3, 0.5);
    const o = AC.createOscillator(); o.type = 'square'; o.frequency.value = 130;
    const g = AC.createGain(); g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.1);
  } else if (kind === 'note') {                     // 看到东西：极轻的一下低频点头
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = 190;
    const g = AC.createGain(); g.gain.setValueAtTime(0.0, t);
    g.gain.linearRampToValueAtTime(0.06, t + 0.04); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.55);
  } else if (kind === 'step') {                     // 脚步：闷响，音高随机一点
    noiseBurst(0.13, 240 + Math.random() * 120, 1.2, 0.34, 'lowpass');
  } else if (kind === 'whoosh') {                   // 过门：噪声扫频
    const {f} = noiseBurst(1.1, 400, 0.8, 0.2);
    f.frequency.setValueAtTime(300, t);

    for (let i = 0; i < 2; i++) {
      const t0 = t + i * 1.6;
      const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = 450;
      const g = AC.createGain();
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.13, t0 + 0.02);
      g.gain.setValueAtTime(0.13, t0 + 0.95);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.05);
      o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 1.1);
    }
  } else if (kind === 'sms') {                     // 短信提示音：清脆的一声短"叮"
    const o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = 940;
    const g = AC.createGain(); g.gain.setValueAtTime(0.0, t);
    g.gain.linearRampToValueAtTime(0.14, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.55);
  } else if (kind === 'hangup') {                   // 被挂断：一声短促的高音
    const o = AC.createOscillator(); o.type = 'square'; o.frequency.value = 620;
    const g = AC.createGain(); g.gain.setValueAtTime(0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + 0.22);
  } else if (kind === 'sting') {                    // 结局：低频下坠
    const o = AC.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(32, t + 2.4);
    const g = AC.createGain(); g.gain.setValueAtTime(0.0, t);
    g.gain.linearRampToValueAtTime(0.3, t + 0.6); g.gain.exponentialRampToValueAtTime(0.001, t + 3.2);

async function voxLoad(name) {

      const kill = new AbortController();

      try {

      if (e && e.name !== 'AbortError') VOXBUF[name] = null;

    const from = tvBuf.duration > TV_START + 8 ? TV_START : 0;
    s.connect(tvGain.inNode);
    s.start(0, from);
    // 自然放完之后把 tvSrc 归位，这样下次再开电视是新的一遍，而不是被当成"已经在放"
    s.onended = () => { if (tvSrc === s) tvSrc = null; };

    tvGain.gain.cancelScheduledValues(AC.currentTime);
    tvGain.gain.setValueAtTime(0, AC.currentTime);
    ramp(tvGain.gain, 0.55, 3.5);          // 静音由 master 统一管，这里不用管 muted
  };
  if (tvBuf) start();
  else songReady(NODES.living.tv.songs).then(start);
}

// 房间壳：地面和天花板是平面，四周默认是圆柱面。
// 如果某个节点提供了 plan（楼层平面多边形，逐个顶点给"方位 u + 水平距离 d 米"），
// 就用真正的平面墙，墙角扎在对的位置——这是唯一能真正消除走动变形的办法。
// 没有 plan 就退回圆柱：圆柱没有棱，不会出现假折痕，但墙面是弯的。
const ROOM = {up: 1.1, down: 1.6, r: 3.0};   // 视高 1.6m，天花板高 1.1m，兜底墙距 3m
const cross2 = (ax, az, bx, bz) => ax * bz - az * bx;
function planRadius(plan, dx, dz) {          // 从原点沿 (dx,dz) 打到多边形墙的水平距离
  let best = Infinity;
  for (let i = 0; i < plan.length; i++) {
    const p = plan[i], q = plan[(i + 1) % plan.length];
    const pa = p.u * Math.PI * 2, qa = q.u * Math.PI * 2;
    const ax = -Math.cos(pa) * p.d, az = Math.sin(pa) * p.d;
    const ex = -Math.cos(qa) * q.d - ax, ez = Math.sin(qa) * q.d - az;
    const den = cross2(dx, dz, ex, ez);
    if (Math.abs(den) < 1e-9) continue;
    const t = cross2(ax, az, ex, ez) / den;
    const s = cross2(ax, az, dx, dz) / den;
    if (t > 1e-4 && s >= -1e-6 && s <= 1 + 1e-6 && t < best) best = t;
  }
  return isFinite(best) ? best : ROOM.r;
}
function roomT(d, plan) {                    // 沿方向 d 打到房间壳的距离
  const horiz = Math.hypot(d.x, d.z);
  const tw = horiz > 1e-6
    ? (plan ? planRadius(plan, d.x / horiz, d.z / horiz) : ROOM.r) / horiz
    : Infinity;
  const ty = (d.y > 0 ? ROOM.up : ROOM.down) / Math.max(Math.abs(d.y), 1e-6);
  return Math.min(tw, ty);
}
function makeRoomGeometry(plan) {
  const g = new THREE.SphereGeometry(1, 192, 128);     // 分段要密，否则地面和墙的交线会被切掉
  const p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).normalize();
    const t = roomT(v, plan);
    p.setXYZ(i, v.x * t, v.y * t, v.z * t);
  }
  p.needsUpdate = true;
  g.computeBoundingSphere();
  return g;
}

// 用硬切而不是交叉溶解：两张静态人像交叉溶解看着像幻灯片，硬切加一点行抖动才像播放中的信号切镜头。

let panoSize = '加载中';
const texCache = {};
// url -> Promise：文件下载完 **并且** 贴图已经推上显存才 resolve。
// 只等下载是不够的：three 默认要等到第一次真拿它去画的那一帧才上传显存，
// 那一下的卡顿就是"进屋先黑一下、几秒之后才出图"的另一半原因。
const panoWait = {};
function loadPano(url) {
  if (texCache[url]) return texCache[url];
  let done;
  panoWait[url] = new Promise(r => { done = r; });
  const t = new THREE.TextureLoader().load(url, tt => {
    const max = renderer.capabilities.maxTextureSize;
    panoSize = `${tt.image.width}x${tt.image.height}`;
    const ratio = tt.image.width / tt.image.height;
    if (Math.abs(ratio - 2) > 0.01) panoSize += ` ⚠ 比例 ${ratio.toFixed(2)}:1 不是 2:1`;
    if (tt.image.width > max) panoSize += ` ⚠ 超过本机贴图上限 ${max}`;
    try { renderer.initTexture(t); } catch (e) {}       // 现在就上传，别留到切场景那一帧
    done(true);
  }, undefined, () => { panoSize = `⚠ ${url} 加载失败`; done(false); });

  texCache[url] = t;

}
const panoReady = url => (loadPano(url), panoWait[url]);
// 所有房间的全景图在后台排队预热：一张一张来，不跟当前这间屋子抢带宽。
// 顺序就是 NODES 的定义顺序，也正好是剧情顺序。十二张一共 5MB 出头，
// 开场那段独白的时间就够它拉完，之后每次换房间、换黄昏/白天那一张都是现成的。
// 为什么不做"全局进度条、全都载完才让人玩"：整包 33MB，真要全等，开场得干等半分钟，
// 而其中大半（第二章那些贴片、照片墙）几分钟之内根本用不到。
async function warmPanos() {
  const list = [...new Set(Object.values(NODES)
    .flatMap(n => [n.pano, n.panoDay])
    .concat([PANO_OUT_HIM, PANO_OUT_EMPTY, PANO_OUT_DUSK,
             PANO_ND_LIVING, PANO_ND_BED,
             PANO_ND_LIVING_NIGHT, PANO_ND_BED_NIGHT])
    .filter(Boolean))];

const geoCache = {};

// ---- 真实深度 ----
// tools/pano_depth.py 用单目深度模型给每张全景图估了一份深度图：8bit 存的是视差
// 在本图范围内的归一化值（近处灰阶密），配套 json 给出米制端点。有了逐像素距离，
// 房间壳就不再是"圆筒 + 天花板地板"的粗胚，而是真实的家具轮廓，走动时的视差才对。
// 只用 reliable 的：走廊那种窄过道地面约束不成立，脚本里定标失败、绝对尺度是猜的，
// 用它反而比解析壳更歪，所以就让它继续用壳。
const DEPTH = {};                // name -> {at(u,vImg)}，有条目就说明这个房间有可用深度
const DEPTH_R = 0.45;            // 有真深度时允许的走动半径（米）
function depthSampler(px, W, H, meta) {
  const lo = 1 / meta.maxDepth, hi = 1 / meta.minDepth;
  return (u, v) => {             // v 按图像算：0 是图顶（天顶）
    const x = u * W - 0.5, y = v * H - 0.5;
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = x - x0, fy = y - y0;
    const xa = ((x0 % W) + W) % W, xb = (((x0 + 1) % W) + W) % W;   // 横向环绕，接缝处不断
    const ya = Math.min(Math.max(y0, 0), H - 1), yb = Math.min(Math.max(y0 + 1, 0), H - 1);
    const g = (xx, yy) => px[(yy * W + xx) * 4];
    const top = g(xa, ya) * (1 - fx) + g(xb, ya) * fx;
    const bot = g(xa, yb) * (1 - fx) + g(xb, yb) * fx;
    const disp = lo + (top * (1 - fy) + bot * fy) / 255 * (hi - lo);
    return Math.min(Math.max(1 / Math.max(disp, 1e-6), 0.35), 12);
  };
}
function makeDepthGeometry(at) {
  const g = new THREE.SphereGeometry(1, 256, 160);
  const p = g.attributes.position, uv = g.attributes.uv, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).normalize();
    // 用网格自己的 uv 去查深度，保证和贴图采样的是同一个像素，不会错位
    const t = at(uv.getX(i), 1 - uv.getY(i));
    p.setXYZ(i, v.x * t, v.y * t, v.z * t);
  }
  p.needsUpdate = true;
  g.computeBoundingSphere();
  return g;
}
function loadDepth(name) {
  // 全景图压成 JPEG 之后后缀不再是 .png（见 tools/compress_assets.py），
  // 所以这儿把后缀整段换掉，别再只认 .png——不然深度图永远找不到，
  // 每个房间都退化成"贴在球壳上"，走动时墙不会近大远小。
  const base = NODES[name].pano.replace('pano-', 'depth-').replace(/\.(png|jpe?g)$/, '');
  fetch(base + '.json')
    .then(r => r.ok ? r.json() : null)
    .then(meta => {
      if (!meta) return;
      if (!meta.reliable) { console.log(name, '深度图定标不可靠，继续用解析房间壳'); return; }
      const im = new Image();

      im.onload = () => {
        const c = Object.assign(document.createElement('canvas'), {width: im.width, height: im.height});
        const cx = c.getContext('2d');
        cx.drawImage(im, 0, 0);
        const px = cx.getImageData(0, 0, im.width, im.height).data;   // 需要同源，用 http 打开而不是 file://
        const at = depthSampler(px, im.width, im.height, meta);
        DEPTH[name] = {at};
        const old = geoCache[name];
        geoCache[name] = makeDepthGeometry(at);
        for (const r of [A, B]) if (r && r.name === name) r.mesh.geometry = geoCache[name];
        old?.dispose();
        NODES[name].walkR = DEPTH_R;
        if (name === node) buildSpots(node);      // 热点要重新贴到真实的墙面上
        console.log(name, `深度已载入 ${meta.minDepth}~${meta.maxDepth}m，走动半径放宽到 ${DEPTH_R}m`);
      };
      im.onerror = () => console.log(name, '深度图加载失败', base);
      im.src = base + '.png';        // 深度图本身必须留 PNG：那是数据，不能有压缩噪点

    })
    .catch(() => {});
}
function makeRoom(nodeName) {
  const n = NODES[nodeName];
  const uOff = {value: n.off};
  const uLampUV = {value: new THREE.Vector2(n.lamp ? n.lamp.u : 0.5, n.lamp ? 1 - n.lamp.v : 0.5)};
  const uHasLamp = {value: n.lamp ? 1 : 0};
  // 电视：矩形给的是贴图 uv（v 向上），所以要把量出来的图像 v 翻过来
  const uTvRect = {value: n.tv
    ? new THREE.Vector4(n.tv.u0, 1 - n.tv.v1, n.tv.u1, 1 - n.tv.v0)
    : new THREE.Vector4(0, 0, 0, 0)};

  const uTvPlay = {value: 0}, uTvDark = {value: 0}, uTvFrame = {value: 0}, uTime = {value: 0};
  const uDay = {value: S.day ? 1 : 0};

  const mat = new THREE.MeshBasicMaterial({map: loadPano(n.pano), side: THREE.BackSide, depthTest: false});
  mat.onBeforeCompile = sh => {
    sh.uniforms.uOff = uOff;
    sh.uniforms.uLampUV = uLampUV;
    sh.uniforms.uHasLamp = uHasLamp;
    sh.uniforms.uTvRect = uTvRect;
    sh.uniforms.uTvMap = uTvMap;
    sh.uniforms.uTvPlay = uTvPlay;
    sh.uniforms.uTvDark = uTvDark;
    sh.uniforms.uTvFrame = uTvFrame;
    sh.uniforms.uTime = uTime;
    sh.uniforms.uDay = uDay;
    sh.uniforms.uDayMap = uDayMap;
    sh.fragmentShader = sh.fragmentShader
      .replace('void main() {', `uniform float uOff;
uniform vec2 uLampUV;
uniform float uHasLamp;
uniform vec4 uTvRect;
uniform sampler2D uTvMap;
uniform float uTvPlay;
uniform float uTvDark;
uniform float uTvFrame;
uniform float uTime;
uniform float uDay;
uniform sampler2D uDayMap;
void main() {`)
      .replace('#include <map_fragment>', `#include <map_fragment>
  #ifdef USE_MAP
  {
    vec3 lit = diffuseColor.rgb;
    // 到台灯的角距离：水平方向要取环绕最短路径，并按纬度收缩
    float du = abs(vMapUv.x - uLampUV.x);
    du = min(du, 1.0 - du);

    float pool = exp(-ang * ang / (2.0 * 0.55 * 0.55)) * uHasLamp; // 台灯照到的范围
    // 暖色像素判定为受台灯影响，冷蓝像素（窗外城市光）关灯后仍应保留
    float warmth = clamp((lit.r - lit.b) * 3.0, 0.0, 1.0);
    vec3 off = max(lit - lit * pool * 0.95, 0.0);          // 扣掉台灯的贡献
    off *= mix(0.50, 0.16, warmth);                        // 整体压暗，暖处压得更狠
    float lum = dot(off, vec3(0.2126, 0.7152, 0.0722));
    off = mix(off, vec3(lum) * vec3(0.50, 0.68, 1.0), 0.45); // 剩下的光偏冷
    diffuseColor.rgb = mix(lit, off, uOff);

    // 白天（周六早上）：跟另一张"白天版"全景图交叉溶解。
    // 窗外的蓝色夜景和玻璃上的雨痕是画进夜景图里的，再怎么提亮也去不掉，
    // 所以白天版是另做的一张图（tools/make_day_panos.py：玻璃换成过曝的暖白天光、
    // 全图压成暖黄白、窗口往房间里洒光）。这里只负责把两张图混起来。
    if (uDay > 0.001) {

      diffuseColor.rgb = mix(diffuseColor.rgb, dayTex, uDay);
    }



    // 电视屏幕。放在关灯处理之后：屏幕是自己发光的，不该被"关灯"压暗。
    if (uTvRect.z > uTvRect.x) {
      vec2 su = (vMapUv - uTvRect.xy) / (uTvRect.zw - uTvRect.xy);
      if (su.x > 0.0 && su.x < 1.0 && su.y > 0.0 && su.y < 1.0) {
        vec2 fu = vec2(su.x, 1.0 - su.y);                  // 屏幕 uv 向上，胶片图向下
        float roll = fract(uTime * 0.11);                  // 缓慢上滚的一条亮带
        float band = exp(-pow((fract(fu.y - roll + 1.0) - 0.5) * 7.0, 2.0));
        fu.x += band * 0.004 + sin(uTime * 37.0 + fu.y * 90.0) * 0.0008;   // 行抖动
        // 取胶片里的第 uTvFrame 格。three 默认 flipY=true，贴图 v=1 才是图的顶端，

        vec3 vid = texture2D(uTvMap, vec2(fu.x, 1.0 - (fu.y + uTvFrame) / 3.0)).rgb;
        float scan = 0.86 + 0.14 * sin(fu.y * 900.0);      // 扫描线
        float flick = 0.93 + 0.07 * sin(uTime * 43.0) + 0.04 * sin(uTime * 7.3);

        float vig = smoothstep(0.0, 0.10, min(min(su.x, 1.0 - su.x), min(su.y, 1.0 - su.y)));
        vid = vid * vig + vec3(0.02, 0.03, 0.05) * vig;    // 边角压暗 + 显像管本身的辉光
        vec3 dark = diffuseColor.rgb * 0.06 + vec3(0.008, 0.010, 0.016);   // 关机只剩一层反光
        diffuseColor.rgb = mix(diffuseColor.rgb, dark, uTvDark);

  };
  const mesh = new THREE.Mesh(geoFor(nodeName), mat);

}
let A = makeRoom(node);          // 当前所在房间（读档之后可能不是客厅）
let B = null;                    // 过渡中正在淡入的房间
scene.add(A.mesh);
// 白天版全景图不再在这里一口气全下——那会和第一幕的门槛抢带宽（十几张并发）。
// 当前房间的 panoDay 由上面 makeRoom 里 loadPano 负责；其余房间全部交给
// startGame() 之后的 warmPanos 排队预热（串行 + 前台让路），天亮渐变前早就绪。

// (u,v) → 单位方向向量，与 SphereGeometry 的 UV 排布一致
const uvToVec = (u, v) => {
  const phi = u * Math.PI * 2, theta = v * Math.PI;
  return new THREE.Vector3(-Math.cos(phi)*Math.sin(theta), Math.cos(theta), Math.sin(phi)*Math.sin(theta));
};
// 热点要贴在房间内壁上，不能再用固定半径，否则摄像机一动热点就会飘。
// 有真深度就查深度图，没有就退回解析壳。
const onWall = (u, v, k = 0.94) => {
  const d = uvToVec(u, v);
  const t = DEPTH[node] ? DEPTH[node].at(u, v) : roomT(d, NODES[node].plan);
  return d.multiplyScalar(t * k);
};
const vecToUV = d => {
  const n = d.clone().normalize();
  let phi = Math.atan2(n.z, -n.x);
  if (phi < 0) phi += Math.PI * 2;

// 你一边往前走，旧房间淡出、新房间淡入（Street View 那种溶解），走完刚好站在新房间中心。
const WALK_L = 2.2;        // 穿过一道门的距离（米）

  const dir = uvToVec(spot.u, 0.5).setY(0).normalize();      // 水平朝那道门
  // 让新房间的回程门落在你前进方向的正后方

  B = makeRoom(name);

  B.mesh.position.copy(dir).multiplyScalar(WALK_L);

// ——— 暂停 ———
// 设置面板一开，整个游戏停住：字幕不再往下走、人声和环境音挂起、走动和视角冻住。
// 以前不停，玩家点开设置看存档的时候剧情还在自己演，回来发现错过了两句。
// 做法是所有"等一段时间"都走 pTimeout：暂停时把剩下的毫秒数记住，恢复时接着走，
// 而不是让 setTimeout 在后台跑完。
let paused = false;
const pauseTimers = new Set();
function pTimeout(fn, ms) {

    h.at = performance.now();
    h.t = setTimeout(() => { pauseTimers.delete(h); fn(); }, h.left);
  };
  h.hold = () => {
    clearTimeout(h.t);
    h.left = Math.max(0, h.left - (performance.now() - h.at));
  };
  h.cancel = () => { clearTimeout(h.t); pauseTimers.delete(h); };
  pauseTimers.add(h);

// 用计数而不是布尔：一段还没走完就被下一段顶掉（sceneId 变了）的情况是有的，

async function callScene(steps) {

  sceneBusy++;
  try {
    for (const st of steps) {
      if (my !== sceneId) return;
      const d = st.a ? await vox(st.a) : 0;
      if (my !== sceneId) return;
      const wait = Math.max(st.d || 0, d ? d + 0.6 : 0, 1.2);
      // 台词（有 t 的）挂着等玩家点，字幕的自动消失也一并停掉（LINE_HOLD）；
      // 没有台词的纯过场拍（藏贴图、换白天这类）照旧按秒数自己流。
      if (st.t) say(st.t, AUTOMATED_TEST ? Math.max(2200, wait * 1000) : LINE_HOLD, st.who);
      st.f?.();

      // 不然它会压到下一句字幕上去。0.18 秒淡出，不是硬切，听不出咔哒。
      if (await (st.t ? waitLine(wait * 1000) : waitStep(wait * 1000)) === 'skip' && st.a) stopVox(0.18);
    }

// 带宽就那么一点（服务器出网 0.3-0.5MB/s），不插队的话这张图排在三个预载连接后面，
// 一等就是五到十秒——字幕先走、图迟到几拍，点得快时图干脆落在后一个场景的台词上，全是错位感。
let fgWait = 0;
const fgIdle = () => fgWait > 0
  ? new Promise(r => setTimeout(r, 200)).then(fgIdle)
  : Promise.resolve();
function preloadPlates(list, lanes = 3) {
  let i = 0;
  const pump = () => {
    if (fgWait > 0) { setTimeout(pump, 200); return; }   // 前台在等图，这条预载先停一停
    if (i >= list.length) return;
    const src = list[i++][0];
    if (PLATE_DONE.has(src)) { pump(); return; }
    const im = new Image();
    im.fetchPriority = 'low';                    // 后台预热不抢当前场景正在拉的图
    im.onload = () => { PLATE_DONE.add(src); pump(); };
    im.onerror = pump;
    im.src = src;
  };
  for (let k = 0; k < lanes; k++) pump();
}

// 贴片要等图真的到了再淡入。#plate 是铺满全屏的 <img>，CSS 里自带 background:#000，
// 所以 .on 一加上就先铺一层纯黑：图还在路上的那几秒，屏幕上就是一整屏黑加一行字幕——
// 看着就是"这张怎么没图"。（第二章那张 invite-photo 有 218KB，前面还排着十张预载，
// 窄带宽下这个窗口能拖到好几秒。）载入失败同理：宁可让玩家继续看着房间，也不要一块黑板。
// plateSeq 是防串台的：图回来得晚，而这期间已经换了下一张或者收了片，这一次就作废。
let plateSeq = 0;
function showPlate([src, pos]) {
  const seq = ++plateSeq;
  fgWait++;
  let settled = false;
  const settle = () => { if (!settled) { settled = true; fgWait--; } };   // 重试路径只结一次账
  const apply = url => {
    settle();                                    // 作废也得让路，不然 fgWait 悬着队列全停
    if (seq !== plateSeq) return;
    PLATE_DONE.add(src);
    plateEl.src = url;
    plateEl.style.objectPosition = pos;
    plateEl.classList.add('on');
  };
  const load = (url, retry) => {
    const im = new Image();
    let over = false;
    const fin = ok => {
      if (over) return;
      over = true;
      clearTimeout(stall);
      if (ok) { apply(url); return; }
      if (retry) { load(src + '?r=' + retry, 0); return; }   // 还在等，继续占着前台位
      settle();
      if (seq !== plateSeq) return;
      console.warn('贴片载入失败，这一拍不铺黑底：' + src);
    };
    // onerror 只管"回了个错"，管不了"挂着不动"——弱网下连接吊死时 onload/onerror 都不来，
    // fgWait 悬着、预载队列全停、图永远不出。20 秒没动静就按失败走。
    const stall = setTimeout(() => fin(false), 20000);
    im.onload = () => fin(true);
    im.onerror = () => fin(false);
    im.src = url;
  };
  load(src, 1);
}
const hidePlate = () => { plateSeq++; plateEl.classList.remove('on'); };
// 「灯灭了」那类收尾：最后一张图随声音一起渐渐暗下去，而不是瞬收。
// 只动 inline opacity（#plate 的全局 transition 只有 transform，加 opacity 过渡会破坏贴片直跳）。
function fadePlateOut(ms = 3000) {
  plateEl.style.transition = `opacity ${ms}ms linear`;
  plateEl.style.opacity = '0';
  setTimeout(() => {
    plateEl.style.transition = '';
    plateEl.style.opacity = '';
    hidePlate();
  }, ms);
}

// 画面上既没有热点、又没有箭头能指、也没有正在走的演出/选项/通话——那就是卡住了。
// 判"没在演"不能只看 sceneBusy：say + waitStep 那种手写的段落不算在里面，
// 所以再加一条"最后一句字幕已经过去 12 秒"——剧情里最长的一句也才 9 秒多。
// 台词等点击（stepSkip 挂着）也不算卡：那是玩家还没点，不是没人管。
// 两个条件都成立、并且连着三次（6 秒）都这样才动手。
let stuckHits = 0, stuckSaid = false;
setInterval(() => {
  if (!resumed || paused) return;              // 还没进游戏、或者面板开着，画面本来就是静的
  // sceneBusy > 0 本来不算卡——戏还在演。但正常演出里"没字幕、没人声、台词也没挂等待"
  // 的静默间隙撑不到 30 秒（最长一拍 10 秒多）：超过了多半是哪句配音把 await 吊死了
  // （弱网下 fetch 挂住不回也不断，voxLoad 的 15 秒超时是第一道保险，这是兜底的）。
  // 这种按卡死处理：作废挂住的演出，按当前进度重放接回来。
  const hungScene = sceneBusy > 0 && !stepSkip && !curVox
                    && performance.now() - lastSay > 30000;
  if (walking || (sceneBusy > 0 && !hungScene) || stepSkip || pickEl.classList.contains('on')
      || phoneUp || callOn || endEl.style.display === 'flex'
      || marks.length || performance.now() - lastSay < 12000) { stuckHits = 0; return; }
  if (++stuckHits < 3) return;
  stuckHits = 0;
  if (sceneBusy > 0) { sceneId++; abortClicks(); }   // 先把挂死的演出作废，resumeFix 才能重放
  if (resumeFix()) return;
  applyGuide();                                // 也许只是箭头和热点没重建
  buildSpots(node);
  if (marks.length) return;
  if (stuckSaid) return;                       // 这句只说一次，剩下的交给设置里那个重新开始
  stuckSaid = true;
  say('（这一拍没有能点的东西了。要是一直停在这儿，可以在右上角的设置里重新开始。）', 6000);
}, 2000);

// 可能已经停在半路，但 sceneBusy/旧字幕不会替玩家把热点重新建出来。
// 回前台统一结束失效演出，再按当前 flags 接回剧情，并重建箭头和热点。
let wasHidden = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    wasHidden = true;
    if (!resetting) save();                    // 离开后台留下进度；重启/读档那一下不写，免得把刚清的又写回去
    // 切后台自动静音（保留原有音频状态，回前台恢复）
    if (master) { master._preMute = master.gain.value; master.gain.value = 0; }
    return;
  }
  // 回前台恢复音频（如果之前被静音）
  if (master && master._preMute !== undefined) { master.gain.value = master._preMute; delete master._preMute; }
  if (!wasHidden) return;
  wasHidden = false;
  sceneId++;                                   // 让后台被冻结的 callScene 安静收尾
  abortClicks();                               // 等点击的台词在后台永远等不到那一下，直接放行
  clearTimeout(storyEl._t);
  storyEl.classList.remove('on');
  pickEl.classList.remove('on');
  pickEl.innerHTML = '';
  setPhone(false);
  if (!walking) {
    // 下一帧再操作 DOM，等 iOS 从后台恢复布局和 WebGL 上下文。
    setTimeout(() => {
      if (document.hidden) return;
      resumeFix();
      applyGuide();
      buildSpots(node);
      applyAudioProfile();
      save();
    }, 180);
  } else {
    // 后台冻结时正在过门，取消半截过渡并回到当前已保存房间。
    // 但过门也可能是剧情拍（sarahLeaveBeat / toShopBeat / guCafeTrip / knotTripBeat 都 walking=true）：
    // 只清 walking 不接剧情，那一段的 mark 已标、收尾没跑，回来就卡住。
    // 所以清完一样要 resumeFix()（它按 flags 幂等，普通过门不中任何分支，什么都不做）。
    // 那三个 Tripping/leaving 闸门也要放掉：它们挡的是"门点一次只开演一次"，
    // 半截被打断后不重置，玩家再点那道门 exitDoor 直接 return，等于再也出不去。
    walking = false;
    walkTo = '';
    shopTripping = guCafeTripping = knotTripping = leaving = false;
    setTimeout(() => { if (!document.hidden) { resumeFix(); applyGuide(); buildSpots(node); applyAudioProfile(); save(); } }, 180);
  }

  const f = k => !!(d.S && d.S.flags && d.S.flags[k]);
  let line;
  if (f('ch2')) line = '第二章';
  else if (f('guChosen')) line = '蛊虫线';
  else if (f('knotChosen')) line = f('knotHis') ? '红绳线·直发'
                                   : f('knotHers') ? '红绳线·卷发' : '红绳线';
  else if (f('calledSarah') || f('shopNight')) line = 'Sarah';
  else if (f('saturday')) line = 'Jude';
  else line = '主线';
  // 咖啡厅那场是贴片戏、人不进新全景，存档时节点还挂在走廊——地点覆盖成「咖啡馆」。
  let room = d.scene;
  if (f('guCafeCall') && !f('guCafeDone')) room = '咖啡馆';
  return room ? `${line}·${room}` : line;
}
// 删掉某一格之后，后面的存档自动往前补位（第 i+1 格挪到第 i 格……最后一格清空）。
function compactSlots(from) {
  for (let j = from; j < SLOT_N - 1; j++) {
    const d = readSlot(j + 1);
    try {
      if (d) localStorage.setItem(slotKey(j), JSON.stringify(d));
      else localStorage.removeItem(slotKey(j));
    } catch (e) {}
  }
  try { localStorage.removeItem(slotKey(SLOT_N - 1)); } catch (e) {}
}
function drawSlots() {
  slotsEl.textContent = '';
  for (let i = 0; i < SLOT_N; i++) {
    const d = readSlot(i);
    const el = document.createElement('div');
    el.className = 'slot';
    if (d) {
      const img = d.thumb
        ? `<img class="shot" src="${d.thumb}" alt="">`
        : '<div class="empty">·</div>';
      el.innerHTML = `${img}<div class="meta"><b>${slotTitle(d)}</b>`
        + `<span>${slotTime(d.at)}${d.S && d.S.day ? ' · 周六' : ' · 那个夜里'}</span></div>`
        + `<button class="del">×</button>`;
      el.title = '点击读取这一格';
      el.onclick = () => loadSlot(i);
      const del = el.querySelector('.del');
      // 删除要按两下：第一下变成"确认?"，三秒没动作就退回去。比再叠一层弹窗轻。
      let armed = false, timer = 0;
      del.onclick = ev => {
        ev.stopPropagation();
        if (!armed) {
          armed = true; del.textContent = '确认?';
          timer = setTimeout(() => { armed = false; del.textContent = '×'; }, 3000);
          return;
        }
        clearTimeout(timer);
        try { localStorage.removeItem(slotKey(i)); } catch (e) {}
        compactSlots(i);                 // 删完后面的自动补位，不留空档
        drawSlots();
      };
    } else {
      el.innerHTML = '<div class="empty">+</div>'
        + '<div class="meta"><b>空</b><span>点击存到这一格</span></div>';
      el.title = '点击存到这一格';
      el.onclick = () => writeSlot(i);
    }
    slotsEl.appendChild(el);
  }
}
document.getElementById('settings').onclick = () => {
  document.exitPointerLock?.();
  keys.clear();                                    // 按着 W 点开面板的话，别让人一边看存档一边往前走
  drawSlots();
  pnEl.style.display = 'flex';
  setPaused(true);                                 // 面板开着＝暂停：字幕、声音、走动全停
};
const closePanel = () => {
  pnEl.style.display = 'none';
  cfEl.style.display = 'none';
  setPaused(false);
};
document.getElementById('pn-close').onclick = closePanel;
document.getElementById('pn-restart').onclick = () => { cfEl.style.display = 'flex'; };
document.getElementById('cf-no').onclick = () => { cfEl.style.display = 'none'; };
document.getElementById('cf-yes').onclick = () => { setPaused(false); restartGame(); };



function resize() {
  // 软件横屏开着的时候，body 被转了 90°，所以画布要按"换过来"的宽高做
  if (rot90) {
    // 尺寸用 px 写死（而不是 100dvh/100dvw）：这样它和 vx/vy 那套换算用的
    // innerWidth/innerHeight 永远是同一个数，不会因为地址栏收放差几个像素
    document.body.style.width = innerHeight + 'px';
    document.body.style.height = innerWidth + 'px';
    // 手机真的转成横屏了就不用再软件转了，否则会转两次
    if (innerWidth > innerHeight) { setRot90(false); return; }
  }
  camera.aspect = vW() / vH();
  renderer.setSize(vW(), vH());
  // 举手机那一下要横移"半个屏幕"，而 CSS 的 vw 在软件横屏时说的还是物理屏，
  // 所以这个长度由这里按当前画面宽度写进去（见 #phone.up）。
  document.body.style.setProperty('--half', vW() * 0.54 + 'px');
  // 画面真正的高度（软件横屏时不等于 innerHeight）。矮屏要换一套设置弹窗的排版，
  // 而媒体查询在软件横屏下看错了边，所以这个标记只能由 JS 打。
  document.documentElement.classList.toggle('short', vH() <= 560);
  if (zoomOn) { applyZoom(); if (callOn) layoutCall(); }   // 画面尺寸变了，放大那一下要重算
  // 竖屏劝横屏。相机的垂直 fov 锁死 75，竖屏时水平视野只剩四十来度，
  // 一间房子只能从一条缝里看——这不是布局能救的，所以直接盖一层让人转手机
  //（转不过来的可以点那层上的"强制横屏"，见 forceLandscape）。
  if (TOUCH) rotateEl.classList.toggle('on', !rot90 && innerHeight > innerWidth * 1.02);
}
// "强制横屏"按钮。两条路：
//   1. 安卓 Chrome：全屏 + Screen Orientation API 真的把方向锁成横屏，最干净；
//   2. iOS Safari（screen.orientation.lock 不存在）或者锁失败：退回软件旋转。
async function forceLandscape() {
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
  } catch (e) { /* 用户拒绝全屏也没关系，下面还有一条路 */ }
  try {
    // iOS Safari 通常没有 orientation.lock。可选链返回 undefined 不会抛异常，
    // 如果直接 await 它，下面会误判成“系统横屏成功”，然后把软件旋转兜底跳过。
    const lock = screen.orientation?.lock;
    if (typeof lock !== 'function') throw new Error('orientation lock unavailable');
    await lock.call(screen.orientation, 'landscape');
    rotateEl.classList.remove('on');
    setTimeout(resize, 240);
    return;
  } catch (e) { /* iOS 或系统锁着：软件转 */ }
  setRot90(true);
}
function setRot90(on) {
  rot90 = on;
  document.body.classList.toggle('rot90', on);
  if (!on) { document.body.style.width = ''; document.body.style.height = ''; }
  rotateEl.classList.remove('on');
  // 记住软件横屏状态：读档/刷新会 location.reload()，回到竖屏时能自动恢复，不用再转一次
  try {
    if (on) localStorage.setItem('chimi.rot', JSON.stringify({rot90: true, rotCCW}));
    else localStorage.removeItem('chimi.rot');
  } catch (e) {}
  resize();
}
document.getElementById('force-land').addEventListener('click', e => {
  e.stopPropagation();
  initAudio();
  AC?.resume();
  forceLandscape();
});
// 旋转屏整层可点：竖屏劝横屏那层上点任意处（不只"强制横屏"按钮）都直接转横屏。
// 加载页撤掉之后它就是进场前的最后一层——玩家点它 = 转屏 + 唤醒音频（bootAudio
// 挂在全局 pointerdown 上，capture 阶段先跑到）+ 开始玩。
rotateEl.addEventListener('click', () => {
  initAudio();
  AC?.resume();
  forceLandscape();
});
// 转反了：换成另一个方向（顺时针 ↔ 逆时针）。只有软件横屏时这个按钮才在。
document.getElementById('flip').addEventListener('click', e => {
  e.stopPropagation();
  rotCCW = !rotCCW;
  document.body.classList.toggle('ccw', rotCCW);
});
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 260));
visualViewport?.addEventListener('resize', resize);   // iOS 地址栏收起/展开也要重算
// 读档/刷新会 reload：把上次的软件横屏（rot90）恢复，别让手机回竖屏还要重转。
// 手机真的在物理横屏时 resize 自己会 setRot90(false) 接管，这里只在竖屏时补软件旋转。
{
  let restoreRot = false, restoreCCW = false;
  try {
    const r = JSON.parse(localStorage.getItem('chimi.rot') || 'null');
    if (r && r.rot90) { restoreRot = true; restoreCCW = !!r.rotCCW; }
  } catch (e) {}
  if (restoreRot && innerHeight > innerWidth) { rotCCW = restoreCCW; setRot90(true); }
  else resize();
}
buildSpots(node);
for (const name of Object.keys(NODES)) loadDepth(name);   // 异步，载入完成后换掉房间壳

const proj = new THREE.Vector3(), look = new THREE.Vector3();
const ease = t => t * t * (3 - 2 * t);
let tvFrame = 0, tvNextCut = 0;
function frame() {
  const now = performance.now();
  // 暂停（设置面板开着）：画面定住，只保留渲染和 rAF。灯光过渡、电视跳帧、走动、
  // 相机跟随、床震全停，回来时接着上一帧走。
  if (paused) {
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
    return;
  }
  if (now >= tvNextCut) {                        // 信号自己在切镜头，间隔不规律才像播放中
    tvFrame = (tvFrame + 1) % TV_N;
    tvNextCut = now + 800 + Math.random() * 1400;
  }
  for (const r of [A, B]) {                      // 过渡时两个房间各按自己节点的状态走
    if (!r) continue;
    const n = NODES[r.name];
    r.uOff.value += (n.off - r.uOff.value) * 0.12;              // 开关灯过渡约 0.3 秒
    r.uTvPlay.value += ((n.tvState === 1 ? 1 : 0) - r.uTvPlay.value) * 0.12;
    r.uTvDark.value += ((n.tvState === 2 ? 1 : 0) - r.uTvDark.value) * 0.12;
    r.uTvFrame.value = tvFrame;
    r.uTime.value = now * 0.001;
    r.uDay.value += ((S.day ? 1 : 0) - r.uDay.value) * 0.014;   // 天亮得慢一点，约 4 秒
  }
  fov += (fovTarget - fov) * 0.08;
  step();
  syncPhone();
  for (const f of fades) f.m.opacity = ease(Math.min(1, (now - f.t0) / f.ms));   // 换全景图的溶解
  if (walking && B) {                            // 过渡中：一边前进一边溶解
    const t = Math.min(1, (now - walkT0) / walkMs);
    B.mat.opacity = ease(t);
    camPos.lerpVectors(walkFrom, walkDest, ease(t));
    if (stepAt && now >= stepAt) { blip('step'); stepAt = now + 340; }
    if (t >= 1) finishWalk();
  } else {
    camPos.lerp(camTarget, 0.12);                // 平时走动是平滑跟随，不是瞬移
  }
  camera.fov = fov;
  camera.updateProjectionMatrix();
  camera.position.copy(camPos);
  shakeAmp += (shakeTarget - shakeAmp) * 0.05;
  if (shakeAmp > 0.0002) {                       // 竖向为主，横向带一点，相位跟喘息锁在一起
    const ph = (now - shakeT0) * SHAKE_W;
    camera.position.y += Math.sin(ph) * shakeAmp;
    camera.position.x += Math.sin(ph + 0.9) * shakeAmp * 0.35;
  }
  camera.lookAt(look.copy(camPos).add(uvToVec(viewU, viewV)));

  // 准星只在"鼠标锁着的第一视角"里有意义。一旦鼠标被交还给玩家——剧情二选一、
  // 手机上那两个名字、照片墙、举着手机、结局卡（这些地方都会主动 exitPointerLock）——
  // 屏幕正中挂一个准星只会让人以为还得用准星去瞄，所以整个收掉，露出真正的鼠标指针。
  const aimOn = locked && photoIdx < 0 && !callOn && !phoneUp
                && !pickEl.classList.contains('on');
  crossEl.style.display = aimOn ? '' : 'none';
  if (aimOn && !walking) {                       // 准星对上可交互物体就亮起来
    ray.setFromCamera(ndc.set(0, 0), camera);
    crossEl.classList.toggle('hot', ray.intersectObjects(hitMarks).length > 0);
  } else {
    crossEl.classList.remove('hot');
  }


  for (const s of marks) {
    if (walking) { s.userData.el.style.display = 'none'; continue; }
    proj.copy(s.position).project(camera);
    const visible = proj.z < 1 && Math.abs(proj.x) < 1 && Math.abs(proj.y) < 1;
    const el = s.userData.el;
    el.style.display = visible ? 'block' : 'none';
    if (visible) {
      el.style.left = (proj.x * 0.5 + 0.5) * vW() + 'px';
      el.style.top = (-proj.y * 0.5 + 0.5) * vH() + 'px';
    }
  }
  drawGuide();
  coordEl.textContent = `${NODES[node].name}  不安 ${S.dread}  u ${viewU.toFixed(3)}  v ${viewV.toFixed(3)}  `
    + `站位 ${camPos.x.toFixed(2)},${camPos.z.toFixed(2)}m  fov ${fov.toFixed(0)}`
    + (DEPTH[node] ? '  深度' : '  壳') + `  |  ${panoSize}`;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
// 画引导箭头。三种情形：目标是 3D 热点且在视野内、在视野外、或者目标是手机（固定 DOM）
const gDir = new THREE.Vector3();
function drawGuide() {
  const g = GUIDE[gStep];
  // 手机上永远拿不到鼠标锁，所以"还没进游戏"不能再用 !locked 判断，
  // 改看加载页还在不在——不然引导箭头在手机上一次都不会出现。
  const notReady = TOUCH ? enterEl.style.display !== 'none' : !locked;
  // 演出期间不指引：正在过台词（sceneBusy）、屏幕上盖着贴片、或者正在等玩家选项，
  // 这几种时候玩家该做的事是看和读，不是去点那个热点。
  // 以前只挡 walking，结果一整段对话里箭头一直在那儿抖，看着像"还得再点一下"。
  // feedRunning 也算：喂完那一句到后续剧情之间有几百毫秒空档（sceneBusy 已经掉到 0），
  // 箭头一冒出来玩家就会再点罐子，把下一次喂养提前开了。
  const inScene = sceneBusy > 0 || plateEl.classList.contains('on')
                  || pickEl.classList.contains('on') || feedRunning;
  if (!g || walking || photoIdx >= 0 || notReady || phoneUp || inScene) {
    guideEl.style.display = 'none';
    return;
  }
  const arw = guideEl.querySelector('.arw'), txt = guideEl.querySelector('.txt');
  if (g.id === 'phone') {
    // getBoundingClientRect 给的是物理屏坐标，而 guideEl 在转过的 body 里面，
    // 所以软件横屏时要把它换算回虚拟坐标：两个对角各映射一次再取 min/max，
    // 这样顺时针、逆时针、不转三种情况都对（rot90 关着时 vx/vy 原样返回）。
    const r = phoneEl.getBoundingClientRect();
    const p0 = {clientX: r.left, clientY: r.top}, p1 = {clientX: r.right, clientY: r.bottom};
    const gx = (Math.min(vx(p0), vx(p1)) + Math.max(vx(p0), vx(p1))) / 2;
    const gy = Math.min(vy(p0), vy(p1));
    guideEl.style.display = 'block';
    guideEl.style.left = gx + 'px';
    guideEl.style.top = Math.max(60, gy - 46) + 'px';
    arw.textContent = '▼';
    arw.style.transform = '';
    txt.textContent = g.tip;
    return;
  }
  const s = marks.find(m => m.userData.id === g.id);
  if (!s) { guideEl.style.display = 'none'; return; }   // 不在这个房间，比如玩家走去了卧室
  proj.copy(s.position).project(camera);
  guideEl.style.display = 'block';
  if (proj.z < 1 && Math.abs(proj.x) < 0.92 && Math.abs(proj.y) < 0.85) {
    guideEl.style.left = (proj.x * 0.5 + 0.5) * vW() + 'px';
    guideEl.style.top = (-proj.y * 0.5 + 0.5) * vH() - 62 + 'px';
    arw.textContent = '▼';
    arw.style.transform = '';
    txt.textContent = g.tip;
    return;
  }
  // 目标在身后或者边缘外：换算到相机自己的坐标系（+x 右、+y 上、看向 -z），
  // 分别求"水平要转多少"和"垂直要抬多少"，哪一边差得多就把箭头钉到那一侧。
  // 以前这里把方向压平了（gDir.y = 0）只算左右，所以灌木丛那种在脚底下、
  // 水平几乎没有偏差的目标，左右号只是噪声，永远被说成"往右转"。
  // 用相机空间而不是世界空间的叉积，是为了跟屏幕方向严格一致——
  // 全景球是从里面看的（BackSide），世界空间那套左右很容易正好反过来。
  gDir.copy(s.position);
  camera.worldToLocal(gDir);
  const gLen = Math.max(1e-4, gDir.length());
  const yaw = Math.atan2(gDir.x, -gDir.z);                              // 右为正，身后是 ±π
  const pitch = Math.asin(THREE.MathUtils.clamp(gDir.y / gLen, -1, 1)); // 上为正
  const vertMain = Math.abs(pitch) > Math.abs(yaw);
  // 两个方向都偏得明显（超过 18 度）就都说，所以会有"往右下看"这种
  const dir = [];
  if (Math.abs(yaw) > 0.31) dir.push(yaw > 0 ? '右' : '左');
  if (Math.abs(pitch) > 0.31) dir.push(pitch > 0 ? '上' : '下');
  if (!dir.length) dir.push(vertMain ? (pitch > 0 ? '上' : '下') : (yaw > 0 ? '右' : '左'));
  if (vertMain) {
    guideEl.style.left = vW() * 0.5 + 'px';
    guideEl.style.top = (pitch > 0 ? 96 : vH() - 96) + 'px';
    arw.textContent = pitch > 0 ? '▲' : '▼';
  } else {
    guideEl.style.left = (yaw > 0 ? vW() - 74 : 74) + 'px';
    guideEl.style.top = vH() * 0.5 + 'px';
    arw.textContent = yaw > 0 ? '▶' : '◀';
  }
  arw.style.transform = 'none';
  txt.textContent = '往' + dir.join('') + '看，找' + (g.what || g.tip.replace('点击', ''));
}
frame();
</script>
